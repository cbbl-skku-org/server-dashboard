name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what the cluster runs (Rocky/RHEL 9 /usr/bin/python3); the newer one catches deprecations early
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q app tests
      - name: Unit tests (fake Slurm)
        run: python -m unittest discover -s tests -v
